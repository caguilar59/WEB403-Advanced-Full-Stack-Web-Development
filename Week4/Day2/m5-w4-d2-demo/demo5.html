<!DOCTYPE html>
<html>
<body>

<p>We will delete object properties with the delete keyword.</p>

<p id="demo"></p>

<script>
var person = {
  firstname: "West",
  lastname: "Cliff",
  age: 80,
  eyecolor: "blue"
};

// add document code here
delete person.age; //2

document.getElementById("demo").innerHTML =
person.firstname + " is " + person.age + " years old.";

//delete person.age; //1
</script>

</body>
</html>
